name: IPO Telegram Alert

on:
  schedule:
    # Backup only. GitHub Actions scheduled runs can be delayed by hours.
    # The primary 07:00 KST trigger should come from an external scheduler via
    # repository_dispatch; these runs remain as fallback attempts. Early runs
    # before 07:00 KST are ignored by ipo_alert.py.
    - cron: "10,30,50 19-22 * * 0-4"
  repository_dispatch:
    types: [ipo-alert]
  workflow_dispatch:
    inputs:
      alert_date:
        description: "Date override (YYYY-MM-DD)"
        required: false
      dry_run:
        description: "Preview without sending"
        type: boolean
        default: true
      force_send:
        description: "Allow a manual resend for testing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ipo-telegram-alert

jobs:
  alert:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ALERT_DATE: ${{ github.event.inputs.alert_date || github.event.client_payload.alert_date }}
      DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
      FORCE_SEND: ${{ (github.event.inputs.force_send == 'true' || github.event.client_payload.force_send == 'true') && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Korean holiday calendar
        run: pip install holidays==0.80
      - name: Check schedule and send Telegram message
        run: python ipo_alert.py
      - name: Save duplicate prevention record
        if: ${{ success() && hashFiles('state/sent.json') != '' }}
        run: |
          if [ -f state/sent.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/sent.json
            git diff --cached --quiet || git commit -m "Record IPO alert delivery"
            git push
          fi
