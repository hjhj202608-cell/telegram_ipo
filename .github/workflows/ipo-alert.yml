name: IPO Telegram Alert

on:
  schedule:
    # GitHub Actions scheduled runs can be delayed. Trigger several times in the
    # 07:00 KST window and rely on state/sent.json to prevent duplicate sends.
    - cron: "10 22 * * 0-4"
    - cron: "30 22 * * 0-4"
    - cron: "50 22 * * 0-4"
  workflow_dispatch:
    inputs:
      alert_date:
        description: "Date override (YYYY-MM-DD)"
        required: false
      dry_run:
        description: "Preview without sending"
        type: boolean
        default: true
      force_send:
        description: "Allow a manual resend for testing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ipo-telegram-alert

jobs:
  alert:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ALERT_DATE: ${{ inputs.alert_date }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
      FORCE_SEND: ${{ inputs.force_send && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Korean holiday calendar
        run: pip install holidays==0.80
      - name: Check schedule and send Telegram message
        run: python ipo_alert.py
      - name: Save duplicate prevention record
        if: ${{ success() && github.event_name == 'schedule' }}
        run: |
          if [ -f state/sent.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/sent.json
            git diff --cached --quiet || git commit -m "Record IPO alert delivery"
            git push
          fi
